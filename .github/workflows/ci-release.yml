name: "CI: Release"

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump type'
                required: true
                type: choice
                default: minor
                options:
                    - major
                    - minor
                    - patch
                    - preview
                    - custom
            custom_version:
                description: 'Custom version (only used if "custom" is selected)'
                required: false
                type: string
            publish_to_nuget:
                description: 'Publish to NuGet after building'
                type: boolean
                default: true

permissions:
    contents: write
    packages: write
    statuses: write
    checks: write
    pages: write
    id-token: write

jobs:
    tests-python:
        name: Python Testing
        runs-on: ubuntu-latest
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.x'

            -   name: Install Test Deps
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install pytest

            -   name: Run Pytest
                run: python -m pytest .github/scripts -q
    
    test-dotnet:
        name: .NET Testing
        runs-on: ubuntu-latest
        
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Restore dependencies
                run: dotnet restore CodeOfChaos.Unions.Testing.slnf

            -   name: Build
                run: dotnet build CodeOfChaos.Unions.Testing.slnf --configuration Release --no-restore

            -   name: Run tests
                run: dotnet test --solution CodeOfChaos.Unions.Testing.slnf --configuration Release --no-restore --no-build
    
    bump-version:
        name: Bump Version
        runs-on: ubuntu-latest
        needs: [ tests-python, test-dotnet ]
        
        permissions:
            contents: write
        
        outputs:
            new_version: ${{ steps.bump.outputs.version }}
            tag_name: ${{ steps.bump.outputs.tag }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    token: ${{ secrets.RELEASE_TOKEN }}

            -   name: Setup Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.x'

            -   name: Configure Git
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

            -   name: Bump Version
                id: bump
                run: |
                    set -euo pipefail
                    
                    if [ "${{ inputs.version_bump }}" == "custom" ]; then
                      if [ -z "${{ inputs.custom_version }}" ]; then
                        echo "Error: custom_version is required when version_bump is 'custom'"
                        exit 1
                      fi
                      VERSION=$(python .github/scripts/bump_version.py custom "${{ inputs.custom_version }}" | tail -n 1)
                    else
                      VERSION=$(python .github/scripts/bump_version.py ${{ inputs.version_bump }} | tail -n 1)
                    fi
                    
                    TAG="v${VERSION}"
                    
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                    echo "tag=$TAG" >> $GITHUB_OUTPUT
                    
                    echo "Bumped to version: $VERSION (tag: $TAG)"

            -   name: Commit and Push
                run: |
                    set -euo pipefail
                    TAG="${{ steps.bump.outputs.tag }}"
                    
                    git add src/Directory.Build.props
                    
                    if ! git diff --cached --quiet; then
                      git commit -m "VersionBump : $TAG"
                      git push origin HEAD:${{ github.ref_name }}
                    else
                      echo "No version file changes detected; skipping commit push."
                    fi
                    
                    if git ls-remote --tags origin "$TAG" | grep -q "refs/tags/$TAG$"; then
                      echo "Tag $TAG already exists on origin; skipping tag push."
                    else
                      git tag "$TAG" HEAD
                      git push origin "$TAG"
                    fi
    
    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [ tests-python, test-dotnet, bump-version ]
        
        env:
            TAG: ${{ needs.bump-version.outputs.tag_name }}
            VERSION: ${{ needs.bump-version.outputs.new_version }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ env.TAG }}
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Restore dependencies
                run: dotnet restore CodeOfChaos.Unions.Release.slnf

            -   name: Build
                run: dotnet build CodeOfChaos.Unions.Release.slnf --configuration Release --no-restore /p:SolutionDir=${{ github.workspace }}/

            -   name: Pack
                run: dotnet pack CodeOfChaos.Unions.Release.slnf --configuration Release -o ./release

            -   name: Upload NuGet Artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: nuget-packages-${{ env.TAG }}
                    path: ./release/*.nupkg

            -   name: Publish Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ env.TAG }}
                    name: Release ${{ env.VERSION }}
                    generate_release_notes: true
                    files: ./release/*.nupkg
                    prerelease: ${{ contains(env.VERSION, 'preview') }}

            -   name: Push to NuGet
                if: ${{ inputs.publish_to_nuget }}
                env:
                    NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "$NUGET_API_KEY" \
                      --source https://api.nuget.org/v3/index.json \
                      --skip-duplicate

            -   name: Push GitHub Packages
                if: ${{ inputs.publish_to_nuget }}
                env:
                    GITHUB_TOKEN: ${{ github.token }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "$GITHUB_TOKEN" \
                      --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                      --skip-duplicate