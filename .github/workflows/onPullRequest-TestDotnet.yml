name: Dotnet Testing

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [ core ] 

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                 dotnet-version: |
                  8.x
                  9.x
                  10.x

            - name: Restore dependencies
              run: dotnet restore Unions.slnx

            - name: Build
              run: dotnet build Unions.slnx --configuration Release --no-restore
            
            - name: Run tests
              run: dotnet test --solution Unions.slnx --configuration Release --no-restore --no-build
